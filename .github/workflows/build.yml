name: Build Twine packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - exe
          - apk
      apk_variant:
        description: APK variant (used when target includes apk)
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main]
    paths:
      - game/**
      - resources/**
      - builder/**
      - twine-build.json
      - package.json
      - package-lock.json
      - .github/workflows/build.yml

permissions:
  contents: read

concurrency:
  group: twine-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exe:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'exe'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Windows signing settings
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'Windows signing is incomplete. Set both WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD, or remove both to build unsigned.'
          }
          if ($hasCertificate) {
            Write-Host '[OK] A custom Windows code-signing certificate is configured.'
          } else {
            Write-Warning 'No Windows code-signing certificate is configured; the installer will be unsigned.'
          }
      - name: Validate and build EXE
        run: npm run build:exe
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-exe
          path: release/exe/*.exe
          if-no-files-found: error
          retention-days: 14

  apk:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'apk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.apk_variant || 'debug' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare web files
        run: npm run prepare:web
      - name: Reject sensitive packaged files
        shell: bash
        run: |
          mapfile -t sensitive_files < <(find dist-web -type f \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.pfx' -o -iname '*.p12' -o -iname '*.base64' -o -iname '*.b64' -o -iname '*keystore*' \))
          if [ "${#sensitive_files[@]}" -ne 0 ]; then
            printf 'Sensitive file must not be packaged: %s\n' "${sensitive_files[@]}" >&2
            exit 1
          fi
      - name: Generate Android project
        run: npx cap add android
      - name: Configure Android fullscreen and icons
        run: npm run android:configure
      - name: Build debug APK
        if: env.APK_VARIANT == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Validate release signing settings
        if: env.APK_VARIANT == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          supplied=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$value" ]; then supplied=$((supplied + 1)); fi
          done
          if [ "$supplied" -ne 4 ]; then
            echo 'Release signing requires all four ANDROID_* GitHub Actions secrets.' >&2
            exit 1
          fi
      - name: Build unsigned release APK
        if: env.APK_VARIANT == 'release'
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Sign release APK
        if: env.APK_VARIANT == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p release/apk signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/release-keystore
          output='release/apk/app-release.apk'
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk release/apk/app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks signing/release-keystore --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" --key-pass "env:ANDROID_KEY_PASSWORD" --out "$output" release/apk/app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$output"
          sha256sum "$output" > release/apk/SHA256SUMS.txt
          rm -rf signing release/apk/app-release-aligned.apk
      - name: Collect debug APK
        if: env.APK_VARIANT == 'debug'
        shell: bash
        run: |
          mkdir -p release/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release/apk/app-debug.apk
      - name: Collect build report
        shell: bash
        run: cp dist-web/build-report.json release/apk/build-report.json
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk-${{ env.APK_VARIANT }}
          path: release/apk/*
          if-no-files-found: error
          retention-days: 14
